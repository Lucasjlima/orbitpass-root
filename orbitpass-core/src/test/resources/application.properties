spring.application.name=orbitpass-core

# H2 Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Disable schema initialization for PgVector since we are using H2 for test
spring.ai.vectorstore.pgvector.initialize-schema=false

# Spring AI Dummy Configuration to satisfy context loading
spring.ai.google.genai.api-key=dummy-api-key-for-test-purposes-only-which-should-be-ignored
spring.ai.google.genai.embedding.api-key=dummy-api-key-for-test-purposes-only-which-should-be-ignored
spring.ai.google.genai.embedding.text.options.dimensions=768
spring.ai.google.genai.chat.options.model=gemini-3.5-flash

# JWT Configuration
orbitpass.security.jwt.secret=my-super-secret-key-that-must-be-at-least-256-bits-long-and-secure-for-testing
orbitpass.security.jwt.expiration-hours=8

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.dynamic=false

# Enable Springdoc HATEOAS support to verify that our local HateoasProperties override works correctly
springdoc.enable-hateoas=true

