spring.application.name=orbitpass-core
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Google GenAI Configuration
spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.embedding.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY}

# JWT Configuration
orbitpass.security.jwt.secret=${ORBITPASS_JWT_SECRET}
orbitpass.security.jwt.expiration-hours=${ORBITPASS_JWT_EXPIRATION_HOURS}


